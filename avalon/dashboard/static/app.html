  const seatRows = seatIds.map((p) => { const s = seats[p], z = s.zones || {}, pr = s.process || {}; const zc = (k) => (z[k] ? z[k].ok : 0);
    return `<tr><td><b>${esc(p)}</b></td><td><span class="dot ${trueSide(p) || ""}"></span> ${esc((S.b.role_names || {})[p] || "")}</td><td class="num">${esc(s.uid)}</td><td>${pr.NoNewPrivs === "1" ? '<span class="ok-mark">on</span>' : esc(pr.NoNewPrivs || "-")}</td><td>${pr.Seccomp === "2" ? '<span class="ok-mark">filter</span>' : esc(pr.Seccomp || "-")}</td><td class="num">${s.tool_calls}</td><td class="num">${zc("own")}</td><td class="num">${zc("public")}</td><td class="num">${s.denied}</td><td>${s.violations.length ? `<span class="bad-mark">${s.violations.length}</span>` : '<span class="ok-mark">0</span>'}</td><td>${s.foreign_canaries_seen.length ? `<span class="bad-mark">${esc(s.foreign_canaries_seen.join(","))}</span>` : '<span class="ok-mark">clean</span>'}</td><td class="num">${s.stop_blocks}</td></tr>`; }).join("");
  const denied = seatIds.flatMap((p) => (seats[p].denied_attempts || []).map((d) => ({ p, ...d })));
  el.innerHTML = `<div class="kpis">
      <div class="kpi"><div class="label">Audit checks</div><div class="v ${sm.failed.length ? "bad" : "ok"}">${sm.passed}/${sm.checks}</div><div class="small muted">${sm.failed.length ? sm.failed.length + " failing" : "all passing"}</div></div>
      <div class="kpi"><div class="label">Tool calls audited</div><div class="v">${totalTools}</div><div class="small muted">from each seat's own transcript</div></div>
      <div class="kpi"><div class="label">Blocked attempts</div><div class="v">${totalDenied}</div><div class="small muted">denied before touching anything</div></div>
      <div class="kpi"><div class="label">Observed violations</div><div class="v ${viol ? "bad" : "ok"}">${viol}</div><div class="small muted">reported file changes or leaked canaries</div></div></div>
    <h3 style="font-size:18px;margin-bottom:8px">Isolation layers</h3><div class="layers">${layers.map(([t, d]) => `<div class="layer"><b>${esc(t)}</b>${esc(d)}</div>`).join("")}</div>
    <h3 style="font-size:18px;margin:6px 0 8px">Checks</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Result</th><th>Game-wide check</th><th>Evidence</th></tr></thead><tbody>${rows}</tbody></table></div>${matrix}
    <div class="chart" id="barrierChart" style="margin-top:14px"></div>
    <h3 style="font-size:18px;margin:6px 0 8px">Per-seat sandbox evidence</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Seat</th><th>Role</th><th class="num">uid</th><th>no_new_privs</th><th>seccomp</th><th class="num">Tool calls</th><th class="num">Own-folder ops</th><th class="num">Public reads</th><th class="num">Blocked</th><th>Violations</th><th>Canaries</th><th class="num">Stop-gate blocks</th></tr></thead><tbody>${seatRows}</tbody></table></div>
    ${denied.length ? `<h3 style="font-size:18px;margin:18px 0 8px">Blocked attempts</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Seat</th><th>Tool</th><th>Input</th><th>Stopped by</th><th>Target</th></tr></thead><tbody>${denied.slice(0, 80).map((d) => `<tr><td><b>${esc(d.p)}</b></td><td>${esc(d.tool)}</td><td><code>${esc(d.input)}</code></td><td>${esc(d.outcome.replace("denied:", ""))}</td><td>${esc((d.zones || []).join(", "))}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
  drawBarrier($("#barrierChart"));
}
function drawBarrier(box) {
  const turns = S.b.turns;
  if (!turns.length) { box.innerHTML = '<div class="muted">No completed turns yet.</div>'; return; }
  const W = Math.max(1100, turns.length * 16 + 70), H = 250, L = 46, R = 12, Tp = 14, Bt = 30;
  const dur = turns.map((t) => t.closed_at - t.opened_at), maxY = Math.max(1, ...dur) * 1.08;
  const x = (i) => L + (i + 0.5) * ((W - L - R) / turns.length), y = (v) => Tp + (H - Tp - Bt) * (1 - v / maxY);
  const raw = maxY / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 5, 10].map((m) => m * mag).find((s) => s >= raw) || raw;
  let g = ""; for (let v = 0; v <= maxY; v += step) { const vv = Math.round(v * 100) / 100; g += `<line x1="${L}" x2="${W - R}" y1="${y(vv)}" y2="${y(vv)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(vv) + 4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${vv}s</text>`; }
  const bw = Math.max(3, Math.min(10, (W - L - R) / turns.length - 4));
  turns.forEach((t, i) => {
    g += `<rect x="${x(i) - bw / 2}" y="${y(dur[i])}" width="${bw}" height="${Math.max(1, y(0) - y(dur[i]))}" rx="2" fill="var(--line-2)"/><line x1="${x(i) - bw / 2 - 2}" x2="${x(i) + bw / 2 + 2}" y1="${y(dur[i])}" y2="${y(dur[i])}" stroke="var(--brass)" stroke-width="2"/>`;
    for (const [p, s] of Object.entries(t.seats)) { if (!s.done_at) continue; const sd = trueSide(p); g += `<circle cx="${x(i)}" cy="${y(Math.max(0, s.done_at - t.opened_at))}" r="3.2" fill="${sd === "evil" ? "var(--evil)" : "var(--good)"}" stroke="var(--panel)" stroke-width="1.5"/>`; }
    g += `<rect class="hit" data-i="${i}" x="${x(i) - 8}" y="${Tp}" width="16" height="${H - Tp - Bt}" fill="transparent"/>`;
  });
  const every = Math.ceil(turns.length / 24);
  turns.forEach((t, i) => { if (i % every === 0) g += `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">${t.turn}</text>`; });
  box.innerHTML = `<div class="label" style="margin-bottom:6px">Barrier timing: when each actor submitted, and when the referee published</div><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 900)}px" role="img" aria-label="Submission times per turn">${g}</svg></div>
    <div class="legend"><span><span class="truth good"></span>Good seat submitted</span><span><span class="truth evil"></span>Evil seat submitted</span><span><svg width="16" height="12"><line x1="1" x2="15" y1="6" y2="6" stroke="var(--brass)" stroke-width="2"/></svg>Public commit, after the last submission</span><span>x: turn · y: seconds since the turn opened</span></div>`;
  const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; box.appendChild(tip);
  box.querySelectorAll(".hit").forEach((r) => {
    r.addEventListener("mouseenter", () => { const t = turns[+r.dataset.i]; const subs = Object.values(t.seats).map((s) => s.done_at).filter(Boolean); tip.textContent = `Turn ${t.turn} · ${KIND[t.kind] || t.kind} · ${t.actors.length} actor(s) · published at ${fmtS(t.closed_at - t.opened_at)} · spread ${fmtS(subs.length ? Math.max(...subs) - Math.min(...subs) : 0)}`; tip.hidden = false; });
    r.addEventListener("mousemove", (ev) => { const bb = box.getBoundingClientRect(); tip.style.left = ev.clientX - bb.left + "px"; tip.style.top = ev.clientY - bb.top + "px"; });
    r.addEventListener("mouseleave", () => (tip.hidden = true));
  });
}

/* ---------- statistics ---------- */
function renderStats(el) {
  const all = S.stats;
  if (!all) { el.innerHTML = `<div class="empty">${S.mode === "live" ? "Loading statistics..." : "No statistics were published with this page."}</div>`; return; }
  const kinds = Object.keys(all);
  if (!kinds.length) { el.innerHTML = '<div class="empty">No finished games yet. Run a batch with <code>avalon batch --games 20</code>.</div>'; return; }
  const cur = S.b.status.driver === "codex" ? "codex" : S.b.status.driver === "scripted" || S.b.status.driver === "bots" ? S.b.status.driver : S.b.status.mock ? "claude-mock" : "claude";
  if (!S.statsKind || !all[S.statsKind]) S.statsKind = all[cur] ? cur : kinds[0];
  const st = all[S.statsKind];
  const picker = `<div class="seg" role="group" aria-label="Players" style="margin-bottom:12px">${kinds.map((k) => `<button data-k="${esc(k)}" aria-pressed="${k === S.statsKind}">${esc(all[k].label)} · ${all[k].games}</button>`).join("")}</div>`;
  const reasons = Object.entries(st.reasons || {}).sort((a, b) => b[1] - a[1]), maxR = Math.max(...reasons.map((r) => r[1]), 1);
  const roleRows = Object.entries(st.roles || {}).map(([r, v]) => `<tr><td><span class="dot ${ROLE_SIDE[r] || ""}"></span> ${esc(ROLE_NAME[r] || r)}</td><td class="num">${v.games}</td><td class="num">${pct(v.win_rate)}</td><td class="num">${v.discernment == null ? "-" : v.discernment.toFixed(2)}</td></tr>`).join("");
  const vt = st.votes || {}, vrow = (k, label) => (vt[k] ? `<tr><td>${label}</td><td class="num">${vt[k].approve}</td><td class="num">${vt[k].reject}</td><td class="num">${pct(vt[k].approve_rate)}</td></tr>` : "");
  const games = (st.list || []).slice(-40).reverse().map((g) => `<tr><td class="mono">${esc(g.id)}</td><td><span class="pill ${g.winner}">${esc(g.winner)}</span></td><td>${esc(REASON[g.reason] || g.reason)}</td><td class="num">${g.players}</td><td class="num">${g.turns}</td><td class="num">${g.minutes}</td></tr>`).join("");
  const c = st.compliance || {}, lc = st.learning_curve || {};
  const lcRows = Object.keys(lc).sort().map((q) => `<div class="row" title="after quest ${q}: ${lc[q].toFixed(2)}"><span>After quest ${esc(q)}</span><div class="bar good" style="width:${Math.max(1, Math.max(0, lc[q]) * 100)}%"></div><span class="num muted">${lc[q].toFixed(2)}</span></div>`).join("");
  const claims = st.claims || {};
  el.innerHTML = `${picker}<p class="muted small" style="margin-top:0">${st.games} finished game${st.games === 1 ? "" : "s"} played by ${esc(st.label.toLowerCase())}.${S.statsKind === "claude-mock" ? " The mock model plays random legal moves, so these numbers test the harness, not strategy." : S.statsKind === "scripted" ? " Heuristic bots without Claude: a baseline." : S.statsKind === "bots" ? " Contributed Python bots, possibly mixed with scripted seats." : ""}</p>
    <div class="kpis">
      <div class="kpi"><div class="label">Good win rate</div><div class="v" style="color:var(--good)">${pct(st.good_win_rate)}</div><div class="small muted">${st.winners.good || 0} of ${st.games}</div></div>
      <div class="kpi"><div class="label">Evil win rate</div><div class="v" style="color:var(--evil)">${pct(1 - st.good_win_rate)}</div><div class="small muted">${st.winners.evil || 0} of ${st.games}</div></div>
      <div class="kpi"><div class="label">Assassin accuracy</div><div class="v">${pct(st.assassination.hit_rate)}</div><div class="small muted">${st.assassination.hits}/${st.assassination.attempts} found Merlin</div></div>
      <div class="kpi"><div class="label">Good players' read</div><div class="v">${st.beliefs && st.beliefs.good_final_discernment != null ? st.beliefs.good_final_discernment.toFixed(2) : "-"}</div><div class="small muted">final discernment, 1 = perfect</div></div>
      <div class="kpi"><div class="label">Discussion rounds</div><div class="v">${st.proposals.avg_discussion_rounds ?? "-"}</div><div class="small muted">average per proposal (max 10)</div></div>
      <div class="kpi"><div class="label">Evil fail-card rate</div><div class="v">${pct(st.quest_cards.evil_fail_rate)}</div><div class="small muted">when an Evil player was on a quest</div></div></div>
    <div class="grid2">
      <div class="chart"><div class="label" style="margin-bottom:8px">How games ended</div><div class="bars">${reasons.map(([r, n]) => `<div class="row" title="${esc(REASON[r] || r)}: ${n}"><span>${esc(REASON[r] || r)}</span><div class="bar ${REASON_SIDE[r] || "n"}" style="width:${(n / maxR) * 100}%"></div><span class="num muted">${n}</span></div>`).join("")}</div>
        <div class="legend"><span><span class="truth good"></span>Good win</span><span><span class="truth evil"></span>Evil win</span></div></div>
      <div class="chart"><div class="label" style="margin-bottom:8px">Do Good players learn? Mean discernment after each quest</div>${lcRows ? `<div class="bars">${lcRows}</div>` : '<div class="muted small">Needs games with belief reports.</div>'}</div></div>
    <div class="grid2">
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Role</th><th class="num">Seats</th><th class="num">Win rate</th><th class="num">Final read</th></tr></thead><tbody>${roleRows}</tbody></table></div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Voter</th><th class="num">Approve</th><th class="num">Reject</th><th class="num">Rate</th></tr></thead><tbody>${vrow("good_on_clean_team", "Good, on all-Good teams")}${vrow("good_on_evil_team", "Good, on teams with Evil")}${vrow("evil", "Evil, any team")}</tbody></table></div></div>
    <div class="grid2">
      <div class="chart"><div class="label" style="margin-bottom:6px">Role claims in public messages</div><div class="small">${Object.keys(claims).length ? Object.entries(claims).map(([k, v]) => `${esc(k)}: <b>${v.good || 0}</b> by Good, <b>${v.evil || 0}</b> by Evil`).join("<br>") : '<span class="muted">No role claims found.</span>'}</div></div>
      <div class="chart"><div class="label" style="margin-bottom:6px">Compliance</div><div class="small">${c.submissions || 0} submissions · ${c.defaulted || 0} defaulted · ${c.stop_blocks || 0} Stop-gate blocks (agents fixed and resubmitted) · ${st.messages.count} public messages, ${st.messages.avg_words ?? "-"} words on average (max ${st.messages.max_words ?? "-"})</div></div></div>
    <h3 style="font-size:18px;margin:6px 0 8px">Games</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Game</th><th>Winner</th><th>How</th><th class="num">Players</th><th class="num">Turns</th><th class="num">Minutes</th></tr></thead><tbody>${games}</tbody></table></div>`;
  el.querySelectorAll(".seg button").forEach((x) => (x.onclick = () => { S.statsKind = x.dataset.k; renderStats(el); }));
}
function renderRules(el) { el.innerHTML = `<div class="card">${md(S.b.rules || "")}</div>`; }

/* ---------- seat dossier ---------- */
function openSeat(p) { S.seat = p; S.seatTab = "decisions"; renderDrawer(); }
function closeSeat() { S.seat = null; document.querySelectorAll(".scrim,.drawer").forEach((n) => n.remove()); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.seat) closeSeat(); });
function renderDrawer() {
  document.querySelectorAll(".scrim,.drawer").forEach((n) => n.remove());
  const p = S.seat; if (!p) return;
  const priv = canSeePrivate(p), T = (S.beats[curIdx()] || {}).turn || 0, kn = known(p, T);
  const tabs = priv ? [["decisions", "Decisions"], ["memory", "Memory"], ["transcript", "Transcript"], ["activity", "Hook log"], ["role", "Role card"]] : [["decisions", "Public actions"]];
  if (!tabs.some(([k]) => k === S.seatTab)) S.seatTab = "decisions";
  const sc = document.createElement("div"); sc.className = "scrim"; sc.onclick = closeSeat;
  const dr = document.createElement("aside"); dr.className = "drawer"; dr.setAttribute("aria-label", `${p} dossier`);
  const seat = (S.b.seats || {})[p] || {};
  dr.innerHTML = `<div class="drawer-h"><div class="row1"><h2>${esc(p)}</h2>${kn.label ? `<span class="pill ${kn.side === "good" || kn.side === "evil" ? kn.side : "brass"}">${esc(kn.label)}</span>` : ""}<button class="btn close" id="closeDr">Close</button></div>
      <div class="small muted mono">${priv && seat.uid ? `uid ${esc(seat.uid)} · session ${esc((seat.model_thread_id || seat.session_id || "").slice(0, 8))}` : priv ? "" : "Private details are hidden from this perspective."}</div>
      <nav class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-t="${k}" aria-selected="${S.seatTab === k}">${l}</button>`).join("")}</nav></div><div class="drawer-b" id="drb"></div>`;
  document.body.append(sc, dr);
  $("#closeDr").onclick = closeSeat;
  dr.querySelectorAll("nav button").forEach((x) => (x.onclick = () => { S.seatTab = x.dataset.t; renderDrawer(); }));
  const body = $("#drb");
  if (S.seatTab === "decisions") body.innerHTML = drawerDecisions(p, priv);
  else if (S.seatTab === "memory") {
    const history = (S.b.memory_history || {})[p] || {};
    const saved = Object.keys(history).map(Number).filter((t) => t <= T).sort((a, b) => b - a)[0];
    body.innerHTML = saved == null ? '<div class="empty">No saved memory at this replay moment.</div>'
      : `<p class="small muted">Private memory saved after turn ${saved}. Later knowledge is hidden when you rewind.</p>${md(history[String(saved)])}`;
  }
  else if (S.seatTab === "transcript") drawerTranscript(p, body);
  else if (S.seatTab === "activity") body.innerHTML = drawerHooks(p);
  else body.innerHTML = `${md((S.b.role_cards || {})[p] || "")}${(S.b.team_prompts || {})[p] ? `<h4 style="margin-top:14px">Team prompt</h4><pre style="white-space:pre-wrap">${esc(S.b.team_prompts[p])}</pre>` : ""}<h4 style="margin-top:14px">Night-phase knowledge</h4><pre class="json">${esc(JSON.stringify((S.b.knowledge || {})[p] || {}, null, 2))}</pre>`;
}
function drawerDecisions(p, priv) {
  const T = (S.beats[curIdx()] || {}).turn || 1e9;
  const rows = S.b.turns.filter((t) => t.turn <= T && t.seats[p] && (priv || t.kind !== "evil_huddle")).reverse();
  if (!rows.length) return '<div class="empty">No turns for this seat yet.</div>';
  return rows.map((t) => {
    const s = t.seats[p], secret = ["quest", "evil_huddle", "assassinate"].includes(t.kind);
    let sub = s.submission;
    if (!priv) sub = secret || !sub ? null : Object.fromEntries(Object.entries(sub).filter(([k]) => !["beliefs", "role_guesses"].includes(k)));
    const n = note(p, t.turn), secs = s.done_at ? s.done_at - t.opened_at : null;
    return `<div class="dturn"><div class="dturn-h"><b>Turn ${t.turn}</b><span>${esc(KIND[t.kind] || t.kind)}${t.round ? " round " + t.round : ""}</span>
      <span>${s.status === "done" ? '<span class="st-ok">submitted</span>' : `<span class="st-bad">${esc(s.status)}</span>`}${s.defaulted ? ` <span class="st-bad" title="${esc(s.fault ? (s.fault.errors || []).join("; ") : "")}">${s.fault ? "fault: default move (" + esc(s.fault.cause.replace(/_/g, " ")) + ")" : "defaulted"}</span>` : ""}</span>
      ${secs != null ? `<span class="num">${fmtS(secs)}</span>` : ""}${priv && s.tool_calls != null ? `<span class="num">${s.tool_calls} tool calls</span>` : ""}${priv && s.stop_blocks ? `<span class="st-warn">${s.stop_blocks} stop-gate block${s.stop_blocks > 1 ? "s" : ""}</span>` : ""}</div>
      ${sub ? `<pre class="json">${esc(JSON.stringify(sub, null, 2))}</pre>` : secret ? '<div class="muted small">Secret action.</div>' : ""}
      ${n ? `<details ${rows.length < 6 ? "open" : ""}><summary class="small" style="cursor:pointer;color:var(--brass);font-weight:600">Private decision document (${words(n)} words)</summary>${md(n)}</details>` : ""}</div>`;
  }).join("");
}
function drawerHooks(p) {
  const h = ((S.b.hooks || {})[p] || []).slice().reverse();
  if (!h.length) return '<div class="empty">No hook events.</div>';
  return `<div class="tblwrap"><table class="tbl"><thead><tr><th>Time</th><th>Event</th><th>Detail</th></tr></thead><tbody>${h.map((e) => {
    const t = e.ts ? new Date(e.ts * 1000).toLocaleTimeString() : "";
    let d = "";
    if (e.event === "PreToolUse") d = `${esc(e.tool)} ${e.guard === "deny" ? '<span class="bad-mark">guard denied</span>' : ""} <code>${esc(e.input || "")}</code>`;
    else if (e.event === "Stop") d = `turn ${esc(e.turn ?? "-")} · ${esc(e.status)}${e.errors ? " · " + esc(e.errors.join("; ")) : ""}`;
    else if (e.event === "turn_done") d = `turn ${esc(e.turn)} · ${e.valid ? '<span class="ok-mark">valid</span>' : '<span class="bad-mark">invalid</span>'}`;
    else if (e.event === "UserPromptSubmit") d = `<code>${esc((e.prompt || "").slice(0, 160))}</code>`;
    else d = esc(e.message || e.source || e.tool || "");
    return `<tr><td class="num muted">${esc(t)}</td><td>${esc(e.event)}</td><td>${d}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}
async function drawerTranscript(p, body) {
  let items = (S.b.transcripts || {})[p] || S.transcripts[p];
  if (!items && S.mode === "live") {
    body.innerHTML = '<div class="empty">Loading transcript...</div>';
    try { items = S.transcripts[p] = await getJSON(`/api/game/${encodeURIComponent(S.gid)}/transcript/${encodeURIComponent(p)}`); }
    catch (e) { body.innerHTML = `<div class="empty">Could not load the transcript: ${esc(e.message)}</div>`; return; }
  }
  if (!items || !items.length) { body.innerHTML = '<div class="empty">No transcript for this seat (bots have none).</div>'; return; }
  const actor = S.b.status.driver === "codex" ? (S.b.status.model || "Codex") : "Claude Code";
  body.innerHTML = `<p class="small muted" style="margin-top:0">Read from this seat's own ${esc(actor)} session log.</p><div class="tl">${items.filter((it) => it.kind !== "system").slice(-400).map((it) => {
    if (it.kind === "tool") {
      const denied = it.is_error && /denied|not allowed|No such tool|Permission|is outside/.test(it.result || "");
      const inp = it.input || {}, brief = inp.file_path || inp.command || inp.pattern || inp.url || JSON.stringify(inp).slice(0, 200);
      return `<div class="it ${denied ? "denied" : ""}"><div class="k">${esc(it.tool)}${denied ? " · denied" : it.is_error ? " · error" : ""}</div><code>${esc(brief)}</code>${it.tool === "Write" && inp.content ? `<pre>${esc(inp.content)}</pre>` : ""}${it.result && (denied || it.is_error || it.tool === "Bash") ? `<pre>${esc(it.result)}</pre>` : ""}</div>`;
    }
    const label = { prompt: "Referee", say: actor, think: "Reasoning", feedback: "Stop gate" }[it.kind] || it.kind;
    return `<div class="it ${it.kind}"><div class="k">${label}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(it.text)}</div></div>`;
  }).join("")}</div>`;
}

window.__avalon = { S, goBeat, render, Voice };   // test hook (screenshots)
/* ---------- boot ---------- */
$("#gameSel").onchange = (e) => loadGame(e.target.value);
$("#perspSel").onchange = (e) => { S.persp = e.target.value; store.set("persp", S.persp); stopPlayback(); S._cards = {}; S.beats = buildBeats(); if (S.beat != null && S.beat >= S.beats.length) S.beat = null; render(); };
const savedTab = store.get("tab"); if (savedTab && TABS.some(([k]) => k === savedTab)) S.tab = savedTab;
const hash = (location.hash || "").slice(1); if (TABS.some(([k]) => k === hash)) S.tab = hash;
const savedP = store.get("persp"); if (savedP) S.persp = savedP;
try { if (window.speechSynthesis) speechSynthesis.getVoices(); } catch {}
const raw = ($("#avalon-data").textContent || "").trim();
if (raw) {
  S.mode = "static";
  const b = JSON.parse(raw);
  S.stats = b.stats || null; S.games = b.games_index || []; S.standings = b.standings || null;
  S.cache[b.id] = b;
  setGame(b);
  const want = new URLSearchParams(location.search).get("game");   // replay.html?game=ID (tournament sites)
  if (want && want !== b.id && S.games.some((g) => g.id === want)) loadGame(want);
} else {
  loadGames().catch((e) => { $("#main").innerHTML = `<div class="empty" style="margin-top:24px">Could not reach the referee API: ${esc(e.message)}</div>`; });
  setInterval(poll, 2000);
}
})();
</script>
