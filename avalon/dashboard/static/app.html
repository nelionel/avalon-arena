<title>Avalon Referee Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Math&display=swap">
<style>
/* Layout: the supplied castle board with players around it (below it on narrow screens)
   beside a speech card that pairs what the speaker said with what they privately thought. Transport and
   chapter strip below; the chronicle, beliefs, terminals, verification and statistics panes underneath. */
:root {
  --bg: #eef0f3; --panel: #ffffff; --panel-2: #f5f6f8; --line: #d9dde4; --line-2: #c3c9d3;
  --ink: #161a22; --ink-2: #4a5160; --ink-3: #646b7b;
  --good: #2f6fb5; --good-soft: #e3edf8; --evil: #b8323a; --evil-soft: #f8e5e6;
  --brass: #8c5f0f; --brass-soft: #f4ead6;
  --ok: #2b7a4b; --ok-soft: #e1f0e7; --warn: #936000; --warn-soft: #f5ebd6; --crit: #c2410c; --crit-soft: #fbe8de;
  --felt: #22423a; --felt-hi: #2f5a4e; --rim: #9a7631; --felt-ink: #eef3ee; --felt-ink-2: #b8cbbf; --felt-line: #3d6b5d;
  --seat: #ffffff; --seat-ink: #161a22;
  --term-bg: #10131a; --term-fg: #d5d9e2; --term-line: #2a2f3b;
  --shadow: 0 1px 2px rgba(22, 26, 34, .06), 0 6px 18px rgba(22, 26, 34, .07);
  --scrim: rgba(14, 17, 24, .38);
  --f-display: "Alegreya SC", "Palatino Linotype", Palatino, Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, "Noto Sans Symbols 2", "Noto Sans Math", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1118; --panel: #161a24; --panel-2: #1c212d; --line: #272d3b; --line-2: #39425a;
    --ink: #e8eaf0; --ink-2: #b0b6c4; --ink-3: #8f96a6;
    --good: #4f8fd6; --good-soft: #17263b; --evil: #d6545b; --evil-soft: #351b20;
    --brass: #d1a24a; --brass-soft: #2e2615;
    --ok: #4fb87e; --ok-soft: #142a1f; --warn: #e0a83c; --warn-soft: #2e2512; --crit: #f2733a; --crit-soft: #351a0f;
    --felt: #183129; --felt-hi: #22443a; --rim: #b48a3c; --felt-ink: #eef3ee; --felt-ink-2: #a9bdb1; --felt-line: #2f5649;
    --seat: #1f2533; --seat-ink: #e8eaf0;
    --term-bg: #0a0c11; --term-fg: #d5d9e2; --term-line: #232836;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 8px 24px rgba(0, 0, 0, .3);
    --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1118; --panel: #161a24; --panel-2: #1c212d; --line: #272d3b; --line-2: #39425a;
  --ink: #e8eaf0; --ink-2: #b0b6c4; --ink-3: #8f96a6;
  --good: #4f8fd6; --good-soft: #17263b; --evil: #d6545b; --evil-soft: #351b20;
  --brass: #d1a24a; --brass-soft: #2e2615;
  --ok: #4fb87e; --ok-soft: #142a1f; --warn: #e0a83c; --warn-soft: #2e2512; --crit: #f2733a; --crit-soft: #351a0f;
  --felt: #183129; --felt-hi: #22443a; --rim: #b48a3c; --felt-ink: #eef3ee; --felt-ink-2: #a9bdb1; --felt-line: #2f5649;
  --seat: #1f2533; --seat-ink: #e8eaf0;
  --term-bg: #0a0c11; --term-fg: #d5d9e2; --term-line: #232836;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 8px 24px rgba(0, 0, 0, .3);
  --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); margin: 0; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
code, pre, .mono { font-family: var(--f-mono); font-size: 12.5px; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: .01em; }
.wrap { max-width: 1360px; margin: 0 auto; padding-inline: 20px; padding-block: 0 56px; }
@media (max-width: 600px) { .wrap { padding-inline: 16px; } }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.num { font-variant-numeric: lining-nums tabular-nums; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 21px; line-height: 1.1; }
.brand .sub { font-size: 12.5px; color: var(--ink-3); }
.pickers { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; }
.pick { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pick label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.sel { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; font-size: 14px; max-width: min(92vw, 380px); cursor: pointer; }
.sel:hover { border-color: var(--ink-3); }
.btn { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 11px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line-2); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: var(--panel); border: 0; padding: 6px 11px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line-2); background: var(--panel); white-space: nowrap; }
.pill.live { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
.pill.err { color: var(--crit); border-color: var(--crit); background: var(--crit-soft); }
.pill.good { color: var(--good); border-color: var(--good); background: var(--good-soft); }
.pill.evil { color: var(--evil); border-color: var(--evil); background: var(--evil-soft); }
.pill.brass { color: var(--brass); border-color: var(--brass); background: var(--brass-soft); }
@keyframes pulse { 50% { opacity: .35; } }

.persp-note { margin-top: 12px; border: 1px solid var(--brass); background: var(--brass-soft); border-radius: 10px; padding: 8px 12px; font-size: 14px; }

/* ---------------- stage: the table + speech card ---------------- */
.stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 18px; margin-top: 16px; align-items: start; }
@media (max-width: 1020px) { .stage { grid-template-columns: 1fr; } }
.tablecard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; min-width: 0; }
.tablebox { width: 100%; }
.table-scene { position: relative; width: 100%; aspect-ratio: 1; }
.board-art { position: absolute; width: 76%; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; border-radius: 10px; background: #fcf8ea; }
.board-art > svg { display: block; width: 100%; height: auto; }
.table-seats { position: absolute; inset: 0; }
.table-status { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 8px 2px; text-align: center; border-top: 1px solid var(--line); }
.table-status .phase { font: 700 17px/1.2 var(--f-display); letter-spacing: .02em; }
.table-status .phase2 { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.reveal { display: flex; gap: 5px; justify-content: center; margin-top: 2px; }
.rcard { width: 22px; height: 31px; border-radius: 4px; display: grid; place-items: center; font: 700 11px var(--f-display); color: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); animation: flip .45s ease-out both; }
.rcard.s { background: var(--good); } .rcard.f { background: var(--evil); }
@keyframes flip { from { transform: rotateY(90deg); opacity: 0; } to { transform: none; opacity: 1; } }
.winbanner { font: 700 18px var(--f-display); padding: 2px 10px; border-radius: 8px; }
.winbanner.good { background: var(--good); color: #fff; } .winbanner.evil { background: var(--evil); color: #fff; }

.seatn { position: absolute; transform: translate(-50%, -50%); width: 104px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; z-index: 2; color: var(--ink); }
.av { width: 76px; height: 76px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, var(--seat), var(--panel-2)); color: var(--seat-ink); display: grid; place-items: center; font: 700 19px/1 var(--f-display); border: 3px solid var(--line-2); box-shadow: var(--shadow); position: relative; transition: transform .2s, box-shadow .2s, border-color .2s; }
.av img { width: 118%; height: 118%; object-fit: contain; margin-top: -14%; pointer-events: none; image-rendering: auto; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .35)); }
.av .sid { position: absolute; top: -7px; left: -7px; background: var(--ink); color: var(--bg); font: 700 11.5px/1 var(--f-body); border-radius: 999px; padding: 3px 6px; letter-spacing: .02em; z-index: 1; }
.ch-unknown img { filter: grayscale(1) brightness(.8) contrast(.9); opacity: .7; }
.ch-evil img { filter: grayscale(1) sepia(1) saturate(4.5) hue-rotate(-40deg) brightness(.85); }
.ch-maybe img { filter: grayscale(1) sepia(1) saturate(2.5) hue-rotate(215deg); }
.qmark { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font: 700 18px var(--f-display); color: var(--bg); background: var(--ink-3); border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; }
.sp-char { width: 132px; height: 132px; flex: none; border-radius: 16px; background: radial-gradient(circle at 50% 42%, var(--panel-2), var(--panel)); border: 2px solid var(--line); display: grid; place-items: center; position: relative; overflow: hidden; }
.sp-char img { width: 100%; height: 100%; object-fit: contain; }
.sp-char.good { border-color: var(--good); } .sp-char.evil { border-color: var(--evil); } .sp-char.maybe { border-color: var(--brass); }
.seatn.good .av { border-color: var(--good); } .seatn.evil .av { border-color: var(--evil); }
.seatn.maybe .av { border-color: var(--brass); border-style: dashed; }
.seatn.speaking .av { transform: scale(1.14); box-shadow: 0 0 0 4px var(--brass-soft), 0 0 0 7px var(--brass), var(--shadow); }
.seatn.dim .av { opacity: .55; }
.seatn.speaking .nm { margin-top: 7px; }
.seatn.viewer .av::after { z-index: 2; content: "you"; position: absolute; bottom: -8px; font: 700 9.5px var(--f-body); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 0 5px; letter-spacing: .04em; }
.seatn .nm { font-size: 12px; font-weight: 600; line-height: 1.15; text-align: center; max-width: 96px; color: var(--ink); background: var(--panel); border-radius: 6px; padding: 1px 5px; }
.seatn .nm:empty { display: none; }
.mdl { --mc: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; line-height: 1.25; padding: 1px 7px 1px 5px; border-radius: 999px; border: 1px solid var(--mc); background: color-mix(in srgb, var(--mc) 14%, var(--panel)); color: var(--ink); white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.mdl::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mc); flex: none; }
.term.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.mdl.lg { font-size: 12.5px; padding: 2px 9px 2px 7px; max-width: none; }
.arena-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 16px; align-items: start; }
@media (max-width: 1180px) { .arena-grid { grid-template-columns: minmax(0, 1fr); } }
.arena-card { min-width: 0; }
.arena-card .tbl td, .arena-card .tbl th { padding: 8px 10px; }
.lbbar { display: inline-block; vertical-align: middle; width: 70px; height: 7px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; margin-right: 8px; }
.lbbar > span { display: block; height: 100%; background: var(--mc); }
.launch h3, .arena-card h3 { margin: 0 0 10px; font-size: 15px; }
.launch .opt { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
.launch .opt.off { opacity: .55; cursor: default; }
.launch .opt small { display: block; color: var(--ink-3); font-size: 11.5px; overflow-wrap: anywhere; }
.launch .opt > span:last-child { min-width: 0; }
.launch .opt .mdl { flex: none; }
.launch .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 10px 0; font-size: 13.5px; }
.launch .row select, .launch .row input[type=number] { padding: 4px 6px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--panel); width: 64px; }
.launch .msg { font-size: 13px; margin-top: 8px; color: var(--ink-2); overflow-wrap: anywhere; }
.launch .msg.err { color: var(--crit); }
.seatn .st { font-size: 11px; color: var(--ink-2); line-height: 1.2; max-width: 112px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
.mark { position: absolute; width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.mark.crown { top: -9px; left: 50%; transform: translateX(-50%); background: var(--rim); color: #fff; }
.mark.team { bottom: -5px; right: -7px; background: var(--brass-soft); color: var(--brass); border: 1.5px solid var(--brass); }
.mark.vote { top: -5px; right: -9px; }
.mark.vote.approve { background: var(--ok); color: #fff; } .mark.vote.reject { background: var(--ink-3); color: #fff; }
.mark.card { top: 50%; left: -15px; transform: translateY(-50%); background: var(--ink-2); color: var(--panel); border-radius: 4px; width: 16px; height: 22px; }
.mark.card.f { background: var(--evil); color: #fff; } .mark.card.s { background: var(--good); color: #fff; }
.table-bubble { margin: 10px 0 0; background: var(--panel-2); color: var(--ink); border-left: 3px solid var(--brass); border-radius: 4px; padding: 8px 10px; font-size: 13px; line-height: 1.4; }
.table-bubble.whisper { border-color: var(--evil); }
@media (max-width: 560px) {
  .table-scene { aspect-ratio: auto; }
  .board-art { position: static; width: 100%; transform: none; }
  .table-seats { position: static; display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 20px 6px; padding: 20px 2px 14px; }
  .seatn { position: relative; left: auto !important; top: auto !important; transform: none; width: 100%; } .av { width: 46px; height: 46px; font-size: 14px; border-width: 2px; } .av .sid { font-size: 9.5px; padding: 2px 4px; } .sp-char { width: 84px; height: 84px; }
  .seatn .nm { font-size: 10.5px; } .seatn .st { font-size: 10px; max-width: 70px; }
  .seatn .mdl { max-width: 100%; font-size: 9.5px; padding: 1px 5px 1px 4px; }
  .mark { width: 16px; height: 16px; font-size: 9px; }
}

/* speech card */
.speech { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.sp-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sp-av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 700 16px var(--f-display); background: var(--panel-2); border: 3px solid var(--line-2); flex: none; }
.sp-av.good { border-color: var(--good); } .sp-av.evil { border-color: var(--evil); } .sp-av.narr { border-color: var(--rim); color: var(--brass); }
.sp-who { font: 700 18px/1.1 var(--f-display); }
.sp-ctx { font-size: 12.5px; color: var(--ink-3); }
.sp-words { font-size: 17.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; position: relative; padding-left: 16px; }
.sp-words::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 3px; background: var(--brass); }
.sp-words.whisper::before { background: var(--evil); }
.sp-narr { font-size: 16px; color: var(--ink-2); }
.priv { border-top: 1px dashed var(--line-2); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.priv h5 { margin: 0; font: 600 11.5px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--brass); display: flex; align-items: center; gap: 6px; }
.priv .mdx { font-size: 14px; color: var(--ink-2); max-height: 230px; overflow: auto; }
.cot { font-size: 13.5px; color: var(--ink-2); font-style: italic; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 170px; overflow: auto; background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.bel { display: grid; grid-template-columns: 34px minmax(0, 1fr) 40px; gap: 4px 8px; align-items: center; font-size: 12.5px; }
.bel .b { height: 9px; border-radius: 0 4px 4px 0; background: var(--evil); min-width: 2px; }
.bel .t { justify-self: end; font-variant-numeric: lining-nums tabular-nums; color: var(--ink-2); }
.bel .who { font-weight: 700; display: flex; align-items: center; gap: 4px; }
.truth { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.truth.good { background: var(--good); } .truth.evil { background: var(--evil); } .truth.unk { background: var(--line-2); }
.votegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.vg { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.vg i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; color: #fff; }
.vg.approve i { background: var(--ok); } .vg.reject i { background: var(--ink-3); }

/* transport */
.transport { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.tp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.tp-row input[type=range] { flex: 1 1 240px; accent-color: var(--brass); min-width: 0; }
.beatlbl { font-size: 13.5px; color: var(--ink-2); min-width: 0; }
.chapters { display: flex; gap: 6px; flex-wrap: wrap; }
.chap { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chap.on { border-color: var(--brass); background: var(--brass-soft); color: var(--brass); font-weight: 700; }
.chap .q { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--line-2); }
.chap .q.s { background: var(--good); } .chap .q.f { background: var(--evil); }
.vstat { font-size: 13px; }

/* tabs and panes */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 28px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; cursor: pointer; font: 700 16px var(--f-display); color: var(--ink-3); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }
.tabs .count { font: 600 12px var(--f-body); color: var(--ink-3); margin-left: 4px; }
.pane { padding-top: 18px; }
.empty { padding: 30px; text-align: center; color: var(--ink-3); border: 1px dashed var(--line-2); border-radius: 12px; }

/* chronicle */
.quest-block { margin-bottom: 26px; }
.quest-block > h3 { font-size: 19px; margin-bottom: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.card h4 { font-size: 16px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }

<script>
(() => {
"use strict";
/* AVALON_BOARD_RENDERER */
const $ = (s, el = document) => el.querySelector(s);
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };

const words = (s) => (String(s || "").match(/\S+/g) || []).length;
const fmtS = (s) => (s == null ? "-" : s < 60 ? `${s.toFixed(1)}s` : `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`);

const KIND = { onboard: "Onboarding", propose: "Proposal", discuss: "Discussion", vote: "Team vote", quest: "Quest",
  evil_huddle: "Evil huddle", assassinate: "Assassination", reflect: "Reflection", over: "Game over" };
const REASON = { five_rejections: "five proposals rejected in one quest", three_failed_quests: "three quests failed",
  three_successful_quests: "three quests succeeded", merlin_assassinated: "the Assassin found Merlin",
  merlin_survived: "Merlin survived the Assassin" };
const REASON_SIDE = { five_rejections: "evil", three_failed_quests: "evil", merlin_assassinated: "evil",
  three_successful_quests: "good", merlin_survived: "good" };
const ROLE_NAME = { merlin: "Merlin", percival: "Percival", servant: "Loyal Servant", morgana: "Morgana",
  assassin: "Assassin", mordred: "Mordred", oberon: "Oberon", minion: "Minion of Mordred" };
const ROLE_SIDE = { merlin: "good", percival: "good", servant: "good", morgana: "evil", assassin: "evil", mordred: "evil", oberon: "evil", minion: "evil" };

const S = { mode: "live", games: [], gid: null, b: null, persp: "referee", tab: "chronicle", beat: null, beats: [],
  playing: false, speed: 1, voice: "auto", seat: null, seatTab: "decisions", transcripts: {}, stats: null,
  statsKind: null, beliefSeat: null, audio: null, timer: null, utter: null, cache: {} };
const PUBLIC = !!window.AVALON_PUBLIC;   // tournament spectator server (bin/avalon dashboard --public)
const store = { get(k) { try { return localStorage.getItem("avalon:" + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("avalon:" + k, v); } catch {} } };

/* ---------- tiny renderers ---------- */
function md(src) {
  const lines = esc(src || "").split("\n");
  const out = []; let para = [], list = [];
  const inline = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>");
  const flush = () => {
    if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; }
    if (list.length) { out.push(`<ul>${list.map((x) => `<li>${inline(x)}</li>`).join("")}</ul>`); list = []; }
  };
  for (const raw of lines) {
    const l = raw.trimEnd(); let m;
    if (/^&lt;!--.*--&gt;$/.test(l.trim())) continue;
    if ((m = l.match(/^#{1,6}\s+(.*)/))) { flush(); out.push(`<h5>${inline(m[1])}</h5>`); }
    else if ((m = l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/))) { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } list.push(m[1]); }
    else if ((m = l.match(/^&gt;\s?(.*)/))) { flush(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }

}
const BASE16 = ["#1b1e26", "#e5534b", "#57ab5a", "#c69026", "#539bf5", "#b083f0", "#39c5cf", "#c5cad3",
  "#636e7b", "#ff938a", "#6bc46d", "#daaa3f", "#6cb6ff", "#dcbdfb", "#56d4dd", "#f0f3f6"];
function xterm256(n) {

    for (let i = 0; i < c.length; i++) {
      const k = c[i];

      else if ((k === 38 || k === 48) && c[i + 1] === 2) { const col = `rgb(${c[i + 2] || 0},${c[i + 3] || 0},${c[i + 4] || 0})`; if (k === 38) st.fg = col; else st.bg = col; i += 4; }
    }
  }
  put(s.slice(last));
  return out;
}

/* ---------- perspective: what may this viewer know? ---------- */
const B = () => S.b;
const viewer = () => (S.persp === "referee" || S.persp === "public" ? null : S.persp);
const isRef = () => S.persp === "referee" && !S.b.public_only;
const finished = () => S.b && S.b.status && S.b.status.status === "finished";
const roleKey = (p) => (S.b.roles || {})[p];
const trueSide = (p) => (S.b.sides ? S.b.sides[p] : ROLE_SIDE[roleKey(p)] || null);
function canSeePrivate(p) { return isRef() || (viewer() === p && !S.b.public_only); }
function viewerIsEvil() { const v = viewer(); return v && trueSide(v) === "evil"; }
function gameOverBy(turn) { return S.b.public_events.some((e) => e.type === "game_over" && e.turn <= turn); }
/* side/role as known to the current viewer at a given turn: {side, label, sure} */
function known(p, turn) {
  if (isRef()) return { side: trueSide(p), label: (S.b.role_names || {})[p] || ROLE_NAME[roleKey(p)] || "", sure: true };
  const over = S.b.public_events.find((e) => e.type === "game_over" && e.turn <= turn);
  if (over) { const name = over.roles[p]; const key = Object.keys(ROLE_NAME).find((k) => ROLE_NAME[k] === name || (name || "").startsWith(ROLE_NAME[k])); return { side: ROLE_SIDE[key] || null, label: name, sure: true }; }
  const v = viewer();
  if (!v) return { side: null, label: "", sure: false };
  if (p === v) return { side: trueSide(p), label: (S.b.role_names || {})[p] || "", sure: true };
  const kn = (S.b.knowledge || {})[v] || {};
  if ((kn.sees_evil || []).includes(p)) return { side: "evil", label: "Evil (you see them)", sure: true };
  if ((kn.evil_teammates || []).includes(p)) return { side: "evil", label: "Evil teammate", sure: true };
  if ((kn.merlin_candidates || []).includes(p)) return { side: "maybe", label: kn.morgana_in_play ? "Merlin or Morgana" : "Merlin", sure: false };
  const huddle = S.b.events && S.b.events.find((e) => e.type === "evil_huddle" && e.turn <= turn);
  if (huddle && viewerIsEvil()) { const evilNow = huddle.entries.map((x) => x.player); if (evilNow.includes(p)) return { side: "evil", label: "Evil (revealed in huddle)", sure: true }; }

}
function visibleEvents() {
  if (isRef()) return S.b.events || S.b.public_events;
  const pub = S.b.public_events.slice();
  const v = viewer();
  if (v && S.b.events) {
    for (const e of S.b.events) {
      if (e.type === "evil_huddle" && trueSide(v) === "evil") pub.push(e);
      if (e.type === "quest_cards" && e.cards[v]) pub.push({ ...e, cards: { [v]: e.cards[v] }, own: true });

}
function note(p, turn) { return canSeePrivate(p) && S.b.notes && S.b.notes[p] ? S.b.notes[p][String(turn)] : null; }
function thoughts(p, turn) { return canSeePrivate(p) && S.b.thoughts && S.b.thoughts[p] ? S.b.thoughts[p][String(turn)] || [] : []; }
function submission(p, turn) {
  if (!canSeePrivate(p)) return null;

  return t && t.seats[p] ? t.seats[p].submission : null;
}
function beliefsAt(p, turn) {
  if (!canSeePrivate(p)) return null;

  for (const t of S.b.turns) { if (t.turn > turn) break; const s = t.seats[p]; if (s && s.submission && s.submission.beliefs) best = { turn: t.turn, b: s.submission.beliefs, g: s.submission.role_guesses }; }

/* ---------- characters (art by role; only what the viewer may know) ---------- */
const CHAR = { merlin: "merlin", percival: "percival", servant: "loyal_servant", morgana: "morgana", assassin: "assassin",
  mordred: "mordred", oberon: "oberon", minion: "mordred" };
function charOf(p, T) {
  let key = null;
  if (isRef() || gameOverBy(T) || viewer() === p) key = roleKey(p);
  if (key && CHAR[key]) return { art: CHAR[key], cls: "" };
  const kn = known(p, T);
  if (kn.side === "evil") return { art: "loyal_servant", cls: "ch-evil" };
  if (kn.side === "maybe") return { art: "loyal_servant", cls: "ch-maybe", q: true };
  return { art: "loyal_servant", cls: "ch-unknown", q: true };
}
function winnerBy(T) { const e = S.b.public_events.find((x) => x.type === "game_over" && x.turn <= T); return e ? e.winner : null; }

  const w = winnerBy(T);

}
function charImg(p, T, talking) {
  const c = charOf(p, T), ex = expression(p, T);
  const name = `${c.art}_${ex}_${talking ? "talk" : "idle"}.webp`;
  const src = (S.b.character_assets || {})[name] || `chars/${name}`;
  return { cls: c.cls, html: `<img src="${src}" alt="" loading="lazy">${c.q ? '<span class="qmark">?</span>' : ""}` };
}

/* ---------- beats: the game as a sequence of moments ---------- */
const fname = (turn, p, kind) => `${String(turn).padStart(4, "0")}_${p}_${kind}.mp3`;
function buildBeats() {
  const beats = [{ kind: "narr", turn: 0, chapter: "Setup", text: `${S.b.players.length} players take their seats. Roles are dealt in secret; each player reads their own role card.` }];
  let chapter = "Setup";
  for (const e of visibleEvents()) {
    const t = e.turn;
    if (e.type === "game_started") { chapter = "Quest 1"; beats.push({ kind: "narr", turn: t, chapter, text: `The game begins. ${e.leader} leads the first quest and must pick ${e.team_size} players.` }); }
    else if (e.type === "proposal") {
      chapter = `Quest ${e.quest}`;
      if (e.message) beats.push({ kind: "say", turn: t, chapter, who: e.leader, text: e.message, sub: "pitch", file: fname(t, e.leader, "pitch"), ctx: `Proposal ${e.proposal} · proposes ${e.team.join(", ")}` });
      else beats.push({ kind: "narr", turn: t, chapter, text: `${e.leader} proposes ${e.team.join(", ")} (proposal ${e.proposal}).` });
    } else if (e.type === "discussion") {
      const spoke = e.entries.filter((x) => x.message), passed = e.entries.filter((x) => !x.message).map((x) => x.player);
      for (const x of spoke) beats.push({ kind: "say", turn: t, chapter, who: x.player, text: x.message, sub: `r${e.round}`, file: fname(t, x.player, `r${e.round}`), ready: x.ready, ctx: `Discussion round ${e.round}${x.ready ? " · ready to vote" : ""}` });
      const ready = e.entries.filter((x) => x.ready).map((x) => x.player);
      beats.push({ kind: "narr", turn: t, chapter, text: `Round ${e.round} closes. ${passed.length ? passed.join(", ") + " passed. " : ""}${ready.length ? "Ready to vote: " + ready.join(", ") + "." : "Nobody is ready to vote yet."}`, minor: true });
    } else if (e.type === "team_amended") beats.push({ kind: "narr", turn: t, chapter, text: `${e.leader} changes the proposed team to ${e.team.join(", ")}.` });
    else if (e.type === "discussion_closed") beats.push({ kind: "narr", turn: t, chapter, minor: true, text: `Discussion ends after ${e.rounds} round${e.rounds === 1 ? "" : "s"}: ${({ all_ready: "everyone is ready to vote", silence: "nobody spoke", max_rounds: "the round limit was reached" })[e.reason]}.` });
    else if (e.type === "vote_result") beats.push({ kind: "vote", turn: t, chapter, e });
    else if (e.type === "quest_cards") { S._cards = S._cards || {}; S._cards[t] = e; }
    else if (e.type === "quest_result") beats.push({ kind: "quest", turn: t, chapter, e });
    else if (e.type === "assassination_phase") { chapter = "Assassination"; beats.push({ kind: "narr", turn: t, chapter, text: "Good has completed three quests. Evil gets one chance: the Assassin will try to name Merlin." }); }
    else if (e.type === "evil_huddle") { for (const x of e.entries) { if (x.message) beats.push({ kind: "say", turn: t, chapter, who: x.player, text: x.message, sub: "huddle", whisper: true, ctx: `Evil huddle (private to Evil)${x.suggested_target ? " · suggests " + x.suggested_target : ""}` }); } }
    else if (e.type === "assassination") {
      if (e.message) beats.push({ kind: "say", turn: t, chapter, who: e.assassin, text: e.message, sub: "assassin", file: fname(t, e.assassin, "assassin"), ctx: `Names ${e.target} as Merlin` });
      beats.push({ kind: "narr", turn: t, chapter, text: `The Assassin ${e.assassin} names ${e.target} as Merlin. ${e.hit ? "Correct: Evil steals the game." : "Wrong: Merlin survives."}`, target: e.target });
    } else if (e.type === "game_over") { chapter = "Endgame"; beats.push({ kind: "over", turn: t, chapter, e }); }
    else if (e.type === "reflections") { for (const x of e.entries) { if (x.message) beats.push({ kind: "say", turn: t, chapter, who: x.player, text: x.message, sub: "reflect", file: fname(t, x.player, "reflect"), ctx: "Post-game reflection" }); } }
  }
  return beats;
}
function cardsFor(turn) { return (S._cards || {})[turn] || null; }

/* ---------- board state at a turn ---------- */
function boardAt(T) {
  const b = S.b, info = b.info || {};
  const sizes = info.quest_team_sizes || [], need = info.fails_required || [];
  const quests = sizes.map((s, i) => ({ n: i + 1, size: s, need: need[i] || 1, res: null }));
  let rej = 0, leader = null, team = null, winner = null, reason = null, propNo = null;
  for (const e of b.public_events) {
    if (e.turn > T) break;
    if (e.type === "game_started") leader = e.leader;
    else if (e.type === "proposal") { leader = e.leader; team = e.team; propNo = e.proposal; }
    else if (e.type === "team_amended") team = e.team;
    else if (e.type === "vote_result" && !e.approved) { rej++; }
    else if (e.type === "quest_result") { quests[e.quest - 1].res = e; rej = 0; }
    else if (e.type === "game_over") { winner = e.winner; reason = e.reason; }
  }
  const questsOver = winner || quests.filter((q) => q.res?.success).length >= 3 || quests.filter((q) => q.res && !q.res.success).length >= 3;
  const curQ = questsOver ? -1 : quests.findIndex((q) => !q.res);
  return { quests, rej, leader, team, winner, reason, curQ, propNo };
}

/* ---------- loading ---------- */
async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.json(); }
function setGame(bundle) {
  stopPlayback();
  S.b = bundle; S.gid = bundle.id; S._cards = {}; S.transcripts = {};
  const opts = perspectiveOptions();
  if (!opts.some((o) => o.v === S.persp)) S.persp = opts[0].v;
  S.beats = buildBeats(); S.beat = null; S.beliefSeat = null;
  render();
}
async function loadGame(gid) {
  store.set("gid", gid);
  if (S.mode === "live") return setGame(await getJSON(`/api/game/${encodeURIComponent(gid)}`));
  if (S.cache[gid]) return setGame(S.cache[gid]);
  $("#main").innerHTML = '<div class="empty" style="margin-top:24px">Loading game...</div>';
  try { S.cache[gid] = await getJSON(`data/${encodeURIComponent(gid)}.json`); setGame(S.cache[gid]); }
  catch (e) { $("#main").innerHTML = `<div class="empty" style="margin-top:24px">This game's data file is not published with the page (${esc(e.message)}).</div>`; }
}
async function loadGames() {
  S.games = await getJSON("/api/games");
  const want = new URLSearchParams(location.search).get("game") || store.get("gid");
  const pick = S.games.find((g) => g.id === want) || S.games.find((g) => g.status === "running")
    || S.games.find((g) => g.driver === "claude" && g.status === "finished") || S.games[0];
  if (pick) await loadGame(pick.id);
  else renderArenaOnly();
  refreshStats();
}
async function refreshStats() { if (S.mode !== "live" || PUBLIC) return; try { S.stats = await getJSON("/api/stats"); if (S.tab === "stats") renderPane(); } catch (e) {} }
async function poll() {
  if (S.mode !== "live" || !S.gid || !S.b) return;
  try {
    const lv = await getJSON(`/api/game/${encodeURIComponent(S.gid)}/live`);
    const grew = lv.turns_count !== S.b.turns.length || lv.status.status !== S.b.status.status;
    if (grew) {
      const following = S.beat == null;
      const fresh = await getJSON(`/api/game/${encodeURIComponent(S.gid)}`);
      const keepBeat = S.beat, playing = S.playing;
      S.b = fresh; S._cards = {}; S.beats = buildBeats();
      S.beat = following ? null : keepBeat;
      if (lv.status.status === "finished") refreshStats();
      render(); if (playing) S.playing = true;
    } else {
      S.b.status = lv.status; S.b.screens = lv.screens; S.b.procs = lv.procs; S.b.hooks = lv.hooks; if (lv.audio) S.b.audio = lv.audio;
      if (!S.playing) renderStage();
      if (S.tab === "terminals") renderPane();
    }
  } catch (e) { /* keep polling */ }
}

/* ---------- pickers ---------- */
function gameLabel(g) {

  const res = g.status === "running" ? "live now" : g.winner ? `${g.winner} won` : g.status;

}
function renderPickers() {

}

/* ---------- top-level render ---------- */

  const st = S.b.status || {};
  $("#sub").textContent = `${S.b.players.length} players · ${st.driver === "codex" ? "Codex sessions (" + (st.model || "") + ")" : st.driver === "claude" ? "interactive Claude Code (" + (st.model || "") + ")" : st.driver === "bots" ? (Object.keys(S.b.lineup || {}).length ? lineupText(Object.values(S.b.lineup)) : "local bots") : "scripted bots"}${st.mock ? (st.driver === "bots" ? " · stand-in models (dry run)" : " · mock model") : ""}`;

    : S.persp === "public" ? '<div class="persp-note">Public record only: what any player could read in the public repo. Roles stay hidden until the game ends.</div>' : "";

/* ---------- the table ---------- */
const curIdx = () => (S.beat == null ? S.beats.length - 1 : S.beat);
function liveSeat(p) {
  const st = S.b.status || {};
  if (S.beat != null || st.status !== "running") return null;
  if (!isRef() && viewer() !== p) return null;
  const done = (st.seats_done || {})[p];
  if (!(st.actors || []).includes(p)) return "waiting";
  if (done) return done.status === "done" ? "✓ submitted" : "⚠ " + done.status;
  const hooks = ((S.b.hooks || {})[p] || []).filter((h) => !st.opened_at || h.ts >= st.opened_at);
  const last = [...hooks].reverse().find((h) => h.event === "PreToolUse");
  if (!last) return "thinking";
  const m = (last.input || "").match(/"(?:file_path|command|pattern)":\s*"([^"]+)/);
  return `${last.tool} ${m ? m[1].split("/").pop() : ""}`;
}
function seatPos(i, n) {
  const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
  return { x: 50 + 44 * Math.cos(a), y: 50 + 42.5 * Math.sin(a) };
}
function renderStage() {
  const box = $("#tablebox"); if (!box || !S.b) return;
  const i = curIdx(), beat = S.beats[i] || S.beats[0];
  const T = beat.turn, bd = boardAt(T);
  const players = S.b.players, n = players.length;
  const voteE = beat.kind === "vote" ? beat.e : null;
  const questE = beat.kind === "quest" ? beat.e : null;
  const qcards = questE ? cardsFor(T) : null;
  const board = AvalonBoard.renderBoard({
    currentMission: bd.curQ < 0 ? null : bd.curQ + 1,
    teamSizes: bd.quests.map((q) => q.size),
    requiredFails: bd.quests.map((q) => q.need),
    missionResults: bd.quests.map((q) => q.res ? (q.res.success ? "success" : "fail") : null),
    rejectedProposals: bd.rej,
  });

  players.forEach((p, k) => {
    const pos = seatPos(k, n), kn = known(p, T);
    const cls = ["seatn", kn.side || "", beat.who === p ? "speaking" : "", viewer() === p ? "viewer" : "",
      beat.kind === "say" && beat.who !== p ? "dim" : ""].join(" ");
    const live = liveSeat(p);
    let marks = "";
    if (bd.leader === p && !bd.winner) marks += `<span class="mark crown" title="Leader">♛</span>`;
    if (bd.team && bd.team.includes(p) && !bd.winner && (bd.curQ >= 0)) marks += `<span class="mark team" title="On the proposed team">◆</span>`;
    if (voteE) marks += `<span class="mark vote ${voteE.votes[p]}" title="${esc(voteE.votes[p])}">${voteE.votes[p] === "approve" ? "✓" : "✗"}</span>`;
    if (questE && questE.team.includes(p)) { const c = qcards && qcards.cards[p]; marks += `<span class="mark card ${c ? (c === "fail" ? "f" : "s") : ""}" title="${c ? "played " + c : "played a secret card"}">${c ? (c === "fail" ? "F" : "S") : "?"}</span>`; }
    const ch = charImg(p, T, beat.kind === "say" && beat.who === p);
    html += `<button class="${cls}" style="left:${pos.x}%;top:${pos.y}%" data-seat="${esc(p)}" aria-label="${esc(p)}${kn.label ? ", " + esc(kn.label) : ""}">
      <span class="av ${ch.cls}">${ch.html}<span class="sid">${esc(p)}</span>${marks}</span><span class="nm">${kn.label ? esc(kn.label) : ""}</span>${mdl(modelOf(p))}${live ? `<span class="st">${live === "thinking" ? '<span class="spin"></span> ' : ""}${esc(live)}</span>` : ""}</button>`;
  });

  else if (beat.kind === "quest") phase2 = `${beat.e.success ? "Quest succeeds" : "Quest fails"}: ${beat.e.fails} fail card${beat.e.fails === 1 ? "" : "s"}`;
  else if (bd.team && !bd.winner) phase2 = `Team: ${bd.team.join(", ")}`;

  const win = bd.winner && beat.kind !== "say" ? `<div class="winbanner ${bd.winner}">${bd.winner === "good" ? "Good" : "Evil"} wins</div><div class="phase2">${esc(REASON[bd.reason] || "")}</div>` : "";
  html += `<div class="table-status">
    ${win || `<div class="phase">${esc(phase)}</div><div class="phase2">${esc(phase2)}</div>`}${reveal}</div>`;
  // Keep the speaking excerpt clear of the castle and mission markers.

    html += `<div class="table-bubble ${beat.whisper ? "whisper" : ""}"><b>${esc(beat.who)}:</b> ${esc(short)}</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll(".seatn").forEach((x) => (x.onclick = () => openSeat(x.dataset.seat)));
  renderSpeech(beat, bd); renderTransport();
}

function beliefBars(p, turn) {
  const bl = beliefsAt(p, turn);
  if (!bl) return "";
  const rows = Object.keys(bl.b).sort(bySeat).map((q) => {
    const v = bl.b[q], kn = isRef() || gameOverBy(turn) ? known(q, turn) : { side: null };
    const guess = bl.g && bl.g[q] ? ` · thinks ${esc(bl.g[q])}` : "";
    return `<span class="who">${esc(q)}<span class="truth ${kn.side || "unk"}" title="${kn.side ? "actually " + kn.side : "true side hidden"}"></span></span>
      <span title="${esc(q)}: ${pct(v)} likely Evil${guess}"><span class="b" style="display:block;width:${Math.max(2, v * 100)}%"></span></span><span class="t">${pct(v)}</span>`;
  }).join("");
  return `<div><h5>Believes, as of turn ${bl.turn}: chance each player is Evil</h5><div class="bel" style="margin-top:6px">${rows}</div>
    ${isRef() || gameOverBy(turn) ? '<div class="legend"><span><span class="truth good"></span>actually Good</span><span><span class="truth evil"></span>actually Evil</span></div>' : ""}</div>`;
}
function privateBlock(p, turn) {
  if (!canSeePrivate(p)) return "";
  const n = note(p, turn), th = thoughts(p, turn).filter((x) => x.kind === "think");
  const parts = [];
  if (n) parts.push(`<div><h5>Private decision document</h5>${md(n)}</div>`);
  if (th.length) parts.push(`<div><h5>Reasoning trace</h5><div class="cot">${esc(th.map((x) => x.text).join("\n\n"))}</div></div>`);
  parts.push(beliefBars(p, turn));

}
function renderSpeech(beat, bd) {

      <div class="sp-narr"><span class="verdict ${e.approved ? "ok" : "no"}">${e.approved ? "Approved" : "Rejected"}</span>, ${e.approvals} of ${Object.keys(e.votes).length} approve. All votes were cast at the same time.</div>
      <div class="votegrid">${rows}</div>${whys ? `<div class="priv">${whys}</div>` : ""}`;
  } else if (beat.kind === "quest") {

    el.innerHTML = `<div class="sp-head"><span class="sp-av narr">⚔</span><div><div class="sp-who">Quest ${e.quest} ${e.success ? "succeeds" : "fails"}</div><div class="sp-ctx">Team ${esc(e.team.join(", "))} · needed ${e.fails_required} fail${e.fails_required > 1 ? "s" : ""} to fail · turn ${T}</div></div></div>
      <div class="sp-narr">${e.successes} success and ${e.fails} fail card${e.fails === 1 ? "" : "s"}. The cards are shuffled, so nobody learns who played what.${c && isRef() ? ` <b>Referee only:</b> ${failers.length ? "fail played by " + esc(failers.join(", ")) : "everyone played success"}.` : c && c.own ? ` You played <b>${esc(Object.values(c.cards)[0])}</b>.` : ""}</div>${whys ? `<div class="priv">${whys}</div>` : ""}`;

      <div class="chips">${Object.keys(e.roles).sort(bySeat).map((p) => `<span class="chip ${known(p, T).side || ""}">${esc(p)} · ${esc(e.roles[p])}</span>`).join("")}</div>`;
  } else {

  el.querySelectorAll("tr[data-g]").forEach((tr) => (tr.onclick = () => { S.tab = "chronicle"; loadGame(tr.dataset.g); }));
  const f = $("#launch");
  f.mock.onchange = () => { S.launchMock = f.mock.checked; S.pick = [...f.querySelectorAll("input[name=m]:checked")].map((x) => x.value); renderArena(el); };
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const body = { models: [...f.querySelectorAll("input[name=m]:checked")].map((x) => x.value), players: +f.players.value, games: +f.games.value, parallel: +f.parallel.value, rounds: +f.rounds.value, huddle_rounds: +f.huddle.value, mock: f.mock.checked };

      const r = await fetch("/api/arena", { method: "POST", headers: { "content-type": "application/json", "x-avalon": "1" }, body: JSON.stringify(body) });
      const out = await r.json();
      if (!r.ok) throw new Error(out.error || r.status);
      msg.className = "msg"; msg.textContent = S.launchMsg = `Started ${out.tag}. The first game opens here as soon as it begins.`;
      followSeries(out.tag);

  };
}
function recentMatches() {
  const list = S.games.filter((g) => g.driver === "bots" && (g.models || []).length && (S.arenaMock || !g.mock)).slice(0, 10);
  if (!list.length) return "";
  const rows = list.map((g) => `<tr data-g="${esc(g.id)}" style="cursor:pointer"><td>${g.status === "running" ? '<span class="pill live">live</span>' : g.winner ? `<span class="pill ${esc(g.winner)}">${esc(g.winner)} won</span>` : `<span class="pill err">${esc(g.status)}</span>`}</td>
    <td>${g.models.map((m) => mdl(m)).join(" ")}</td><td class="num">${g.players}p</td><td class="num">${g.status === "running" ? "turn " + esc(g.turn || 0) : esc((g.win_reason || "").replace(/_/g, " "))}</td><td class="mono small" title="${esc(g.id)}">${esc(String(g.id).slice(9, 11) + ":" + String(g.id).slice(11, 13) + " · " + String(g.id).slice(-4))}</td></tr>`).join("");

async function followSeries(tag) {

function renderArenaOnly() {

/* ---------- chronicle ---------- */
function renderChronicle(el) {
  const beat = S.beats[curIdx()] || { turn: 0 };
  const T = beat.turn;
  const evs = visibleEvents().filter((e) => e.turn <= T);
  if (!evs.length) { el.innerHTML = '<div class="empty">Nothing has happened yet at this point of the game. Press Play or drag the slider.</div>'; return; }
  const blocks = []; let cur = null;
  const open = (title) => { cur = { title, html: [] }; blocks.push(cur); };
  open("Before the first quest");
  let curQuest = null;
  for (const e of evs) {
    const t = e.turn;
    if (e.type === "game_started") {
      const ops = S.b.players.filter((p) => note(p, t)).map((p) => `<div class="msg"><div class="msg-h"><span class="who">${esc(p)}</span>${mdl(modelOf(p))}${known(p, t).label ? `<span class="dot ${known(p, t).side || ""}"></span><span class="muted">${esc(known(p, t).label)}</span>` : ""}</div><details class="why"><summary>Opening strategy (private)</summary>${md(note(p, t))}</details></div>`).join("");
      cur.html.push(`<div class="card"><h4>The game begins <span class="meta">first leader ${esc(e.leader)}</span></h4>${ops ? `<div class="msgs">${ops}</div>` : ""}</div>`);
    } else if (e.type === "proposal") {
      if (curQuest !== e.quest) { curQuest = e.quest; open(`Quest ${e.quest}`); }
      cur.html.push(`<div class="card"><h4>♛ ${esc(e.leader)} ${mdl(modelOf(e.leader))} proposes <span class="chips">${e.team.map((p) => chip(p, T)).join("")}</span><span class="meta">proposal ${e.proposal} · turn ${t}</span></h4>${e.message ? `<div class="msg" style="margin-top:8px"><p>${esc(e.message)}</p>${whyBlock(e.leader, t)}</div>` : whyBlock(e.leader, t)}</div>`);
    } else if (e.type === "discussion") {
      const msgs = e.entries.map((x) => x.message
        ? `<div class="msg"><div class="msg-h"><span class="who">${esc(x.player)}</span>${mdl(modelOf(x.player))}${known(x.player, T).side ? `<span class="dot ${known(x.player, T).side}"></span>` : ""}${x.ready ? '<span class="pill">ready</span>' : ""}<span class="muted num" style="margin-left:auto">${words(x.message)} w</span></div><p>${esc(x.message)}</p>${whyBlock(x.player, t)}</div>`
        : `<div class="msg passed"><div class="msg-h"><span class="who">${esc(x.player)}</span>${mdl(modelOf(x.player))}<span>passed${x.ready ? " · ready" : ""}</span></div>${whyBlock(x.player, t)}</div>`).join("");
      cur.html.push(`<div class="card"><h4>Discussion round ${e.round} <span class="meta">turn ${t} · written simultaneously, published together</span></h4><div class="msgs">${msgs}</div></div>`);
    } else if (e.type === "team_amended") cur.html.push(`<div class="card"><h4>♛ ${esc(e.leader)} changes the team to <span class="chips">${e.team.map((p) => chip(p, T)).join("")}</span></h4></div>`);
    else if (e.type === "discussion_closed") cur.html.push(`<div class="meta" style="margin:-2px 0 10px 4px">Discussion closed after ${e.rounds} round${e.rounds === 1 ? "" : "s"}.</div>`);
    else if (e.type === "vote_result") {
      const toks = Object.keys(e.votes).sort(bySeat).map((p) => `<span class="vg ${e.votes[p]}"><i>${e.votes[p] === "approve" ? "✓" : "✗"}</i><b>${esc(p)}</b></span>`).join("");
      cur.html.push(`<div class="card"><h4>Vote on <span class="chips">${e.team.map((p) => chip(p, T)).join("")}</span> <span class="verdict ${e.approved ? "ok" : "no"}">${e.approved ? "Approved" : "Rejected"}</span><span class="meta num">${e.approvals}/${Object.keys(e.votes).length} · turn ${t}</span></h4><div class="votegrid" style="margin-top:8px">${toks}</div></div>`);
    } else if (e.type === "quest_cards") {
      const failed = Object.entries(e.cards).filter(([, c]) => c === "fail").map(([p]) => p).sort(bySeat);
      cur.html.push(`<div class="meta" style="margin:-4px 0 10px 4px">${e.own ? `You played ${esc(Object.values(e.cards)[0])}.` : `Referee only: ${failed.length ? "fail cards from " + failed.map(esc).join(", ") : "every card was a success"}.`}</div>`);
    } else if (e.type === "quest_result") cur.html.push(`<div class="card"><h4>Quest ${e.quest} <span class="verdict ${e.success ? "ok" : "no"}">${e.success ? "succeeded" : "failed"}</span><span class="meta">${e.successes} success, ${e.fails} fail · team ${esc(e.team.join(", "))} · turn ${t}</span></h4></div>`);
    else if (e.type === "assassination_phase") open("The assassination");
    else if (e.type === "evil_huddle") cur.html.push(`<div class="card"><h4>Evil huddle, round ${e.round} <span class="meta">private to Evil · turn ${t}</span></h4><div class="msgs">${e.entries.map((x) => `<div class="msg"><div class="msg-h"><span class="who">${esc(x.player)}</span>${mdl(modelOf(x.player))}<span class="dot evil"></span>${x.suggested_target ? `<span class="muted">suggests ${esc(x.suggested_target)}</span>` : ""}</div><p>${esc(x.message || "(no message)")}</p>${whyBlock(x.player, t)}</div>`).join("")}</div></div>`);
    else if (e.type === "assassination") cur.html.push(`<div class="card"><h4>The Assassin ${esc(e.assassin)} ${mdl(modelOf(e.assassin))} names ${chip(e.target, T)} <span class="verdict ${e.hit ? "no" : "ok"}">${e.hit ? "Merlin found" : "wrong guess"}</span></h4>${e.message ? `<div class="msg" style="margin-top:8px"><p>${esc(e.message)}</p></div>` : ""}${whyBlock(e.assassin, t)}</div>`);
    else if (e.type === "game_over") { open("Game over"); cur.html.push(`<div class="card"><h4><span class="verdict ${e.winner === "good" ? "ok" : "no"}">${e.winner === "good" ? "Good" : "Evil"} wins</span> <span class="meta">${esc(REASON[e.reason] || e.reason)}</span></h4><div class="chips" style="margin-top:8px">${Object.keys(e.roles).sort(bySeat).map((p) => `<span class="chip ${known(p, T).side || ""}">${esc(p)} · ${esc(e.roles[p])}</span>`).join("")}</div></div>`); }
    else if (e.type === "reflections") cur.html.push(`<div class="card"><h4>Post-game reflections <span class="meta">turn ${t}</span></h4><div class="msgs">${e.entries.map((x) => `<div class="msg ${x.message ? "" : "passed"}"><div class="msg-h"><span class="who">${esc(x.player)}</span>${mdl(modelOf(x.player))}</div>${x.message ? `<p>${esc(x.message)}</p>` : ""}${whyBlock(x.player, t)}</div>`).join("")}</div></div>`);
  }
  el.innerHTML = `<p class="small muted" style="margin-top:0">Everything up to the moment selected above, newest quest first.</p>` + blocks.filter((x) => x.html.length).map((x) => `<div class="quest-block"><h3>${esc(x.title)}</h3>${x.html.join("")}</div>`).reverse().join("");
}

/* ---------- beliefs ---------- */
function beliefSeries(p) {
  const out = [];
  for (const t of S.b.turns) { const s = t.seats[p]; if (s && s.submission && s.submission.beliefs) out.push({ turn: t.turn, b: s.submission.beliefs, g: s.submission.role_guesses }); }
  return out;
}
function discernment(b) {
  const ev = Object.keys(b).filter((q) => trueSide(q) === "evil"), gd = Object.keys(b).filter((q) => trueSide(q) === "good");
  if (!ev.length || !gd.length) return null;
  const m = (xs) => xs.reduce((s, q) => s + b[q], 0) / xs.length;
  return m(ev) - m(gd);
}
function heatColor(v) { return `color-mix(in oklab, var(--evil) ${Math.round(v * 92)}%, var(--panel))`; }
function renderBeliefs(el) {
  const v = viewer();
  const seats = isRef() ? S.b.players : v ? [v] : [];
  if (!seats.length) { el.innerHTML = '<div class="empty">Beliefs are private to each player. Choose "Referee" or a player in "Seen as" to look inside.</div>'; return; }
  if (!S.beliefSeat || !seats.includes(S.beliefSeat)) S.beliefSeat = seats.find((p) => trueSide(p) === "good" && roleKey(p) === "merlin") || seats[0];
  const obs = S.beliefSeat, series = beliefSeries(obs);
  const pick = seats.length > 1 ? `<div class="seg" role="group" aria-label="Whose beliefs" style="margin-bottom:12px">${seats.map((p) => `<button data-p="${esc(p)}" aria-pressed="${p === obs}">${esc(p)}</button>`).join("")}</div>` : "";
  if (!series.length) { el.innerHTML = pick + '<div class="empty">No belief reports for this seat (games before belief tracking, or the seat never acted).</div>'; bindBeliefPick(el); return; }
  const targets = Object.keys(series[series.length - 1].b).sort(bySeat);
  const T = (S.beats[curIdx()] || {}).turn || 1e9;
  const head = `<tr><th></th>${series.map((s) => `<th title="turn ${s.turn}" style="${s.turn > T ? "opacity:.35" : ""}">${s.turn}</th>`).join("")}<th>truth</th></tr>`;
  const rows = targets.map((q) => { const kn = isRef() || gameOverBy(T) ? known(q, T) : known(q, T);
    return `<tr><td class="lbl">${esc(q)}</td>${series.map((s) => { const x = s.b[q]; return x == null ? "<td></td>" : `<td title="turn ${s.turn}: ${pct(x)} likely Evil${s.g && s.g[q] ? ", guessed " + esc(s.g[q]) : ""}" style="background:${heatColor(x)};color:${x > .55 ? "#fff" : "var(--ink)"};${s.turn > T ? "opacity:.35" : ""}">${Math.round(x * 100)}</td>`; }).join("")}<td>${kn.side ? `<span class="chip ${kn.side === "good" || kn.side === "evil" ? kn.side : ""}">${esc(kn.label || kn.side)}</span>` : '<span class="muted">hidden</span>'}</td></tr>`; }).join("");
  const sparks = isRef() ? S.b.players.map((p) => sparkCard(p)).join("") : "";
  el.innerHTML = `${pick}
    <div class="chart"><div class="label" style="margin-bottom:8px">${esc(obs)} (${esc(known(obs, 1e9).label || "")}): probability each player is Evil, per turn</div>
      <div style="overflow-x:auto"><table class="heat">${head}${rows}</table></div>
      <div class="legend"><span>Cells: 0 = sure Good, 100 = sure Evil. Columns after the current moment are faded.</span></div></div>
    ${isRef() ? `<h3 style="font-size:18px;margin:6px 0 8px">How well each player read the table</h3>
      <p class="small muted" style="margin-top:0">Discernment = average P(Evil) given to the players who really are Evil minus the average given to the players who really are Good. 1 is a perfect read, 0 is no better than a coin.</p>
      <div class="sparks">${sparks}</div>` : ""}`;
  bindBeliefPick(el);
}
function bindBeliefPick(el) { el.querySelectorAll("[data-p]").forEach((b) => (b.onclick = () => { S.beliefSeat = b.dataset.p; renderBeliefs(el); })); }
function sparkCard(p) {
  const s = beliefSeries(p).map((x) => ({ t: x.turn, d: discernment(x.b) })).filter((x) => x.d != null);
  const kn = known(p, 1e9);
  if (s.length < 1) return `<div class="spark"><b>${esc(p)}</b> <span class="muted small">${esc(kn.label)}</span><div class="small muted">no beliefs</div></div>`;
  const W = 220, H = 64, L = 4, R = 4, Tp = 6, Bt = 6;
  const xs = (k) => L + (s.length === 1 ? (W - L - R) / 2 : (k * (W - L - R)) / (s.length - 1));
  const ys = (v) => Tp + (H - Tp - Bt) * (1 - (v + 1) / 2);
  const pts = s.map((x, k) => `${xs(k)},${ys(x.d)}`).join(" ");
  const area = `${xs(0)},${ys(0)} ${pts} ${xs(s.length - 1)},${ys(0)}`;
  const last = s[s.length - 1];
  const col = kn.side === "evil" ? "var(--evil)" : "var(--good)";
  return `<div class="spark"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b>${esc(p)} <span class="muted small" style="font-weight:500">${esc(kn.label)}</span></b><span class="num" style="font-weight:700">${last.d.toFixed(2)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p)} discernment over turns, last ${last.d.toFixed(2)}"><line x1="${L}" x2="${W - R}" y1="${ys(0)}" y2="${ys(0)}" stroke="var(--line-2)" stroke-dasharray="3 3"/>
      <polygon points="${area}" fill="${col}" opacity=".14"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${xs(s.length - 1)}" cy="${ys(last.d)}" r="3.5" fill="${col}" stroke="var(--panel)" stroke-width="1.5"/></svg>
    <div class="small muted">${s.length} reports · dashed line = no information</div></div>`;
}

/* ---------- terminals ---------- */

/* ---------- verification ---------- */

    ["seccomp filter", "No bind/listen, SysV or POSIX IPC, ptrace, keyrings, namespaces, mounts or io_uring."],
    ["Claude Code permissions", "--restricted, a fixed tool list, dontAsk mode (nothing prompts; anything not allowed is denied), explicit path rules."],
    ["Hook gates", "PreToolUse re-checks every path; the Stop gate requires reading the public repo, a private decision doc and a valid submission."],
    ["Referee barrier", "Each turn is collected from every actor before one public commit; quest cards aggregated, huddles routed only to Evil."],
  ];
  const mark = (c) => (c.ok ? '<span class="ok-mark">✓ pass</span>' : '<span class="bad-mark">✗ fail</span>');
